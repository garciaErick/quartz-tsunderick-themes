# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# ══════════════════════════════════════════════════════════════════════════
#  CHILD-SITE STARTER CONFIG — quartz-tsunderick-themes engine
#
#  Copy to your site root as quartz.config.yaml:
#    cp engine/templates/quartz.config.yaml quartz.config.yaml
#
#  Then edit the IDENTITY BLOCK below (pageTitle, baseUrl, fonts, colors).
#  Everything else can stay as-is — plugin list and layout mirror the
#  engine defaults. Disabled plugins are kept listed so you can flip them
#  on without hunting for sources.
# ══════════════════════════════════════════════════════════════════════════

configuration:
  # ─── IDENTITY BLOCK — make these yours ────────────────────────────────
  pageTitle: My Site
  pageTitleSuffix: ""
  baseUrl: example.com
  # ──────────────────────────────────────────────────────────────────────
  enableSPA: true
  enablePopovers: true
  analytics: null # or e.g. plausible / cloudflare — see Quartz docs
  locale: en-US
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography: # any Google Fonts names work
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors: # your palette — light/dark pairs
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"

plugins:
  # ─── transformers (markdown → mdast/hast) ─────────────────────────────
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
  - source: "./plugins/toc-true-depth" # engine plugin: TOC honoring true heading depth
    enabled: true
    order: 51
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "./plugins/theme-switcher" # engine plugin: the theme dropdown
    enabled: true
    order: 60
    options:
      # bakedTheme must be a REAL theme id from the list below (a theme that
      # ships its own CSS). "default" is special: it's your site's base
      # palette from the colors block above and has no CSS — using it here
      # makes the plugin error out and get skipped silently.
      bakedTheme: lattelogic
      themes: # trim this list to the themes you want in the menu
        - id: default
          label: Lattelogic
        - id: typora-milky
          label: Typora Milky
        - id: typora-smoky
          label: Typora Smoky
        - id: 80s-neon
          label: 80s Neon
        - id: amber-cathode
          label: Amber Cathode
        - id: aurora
          label: Aurora
        - id: darkrune
          label: Darkrune
        - id: hanabi
          label: Hanabi
        - id: hoverpopup
          label: Hoverpopup
        - id: kanagawa-hokusai
          label: Kanagawa Hokusai
        - id: lyt-mode
          label: Lyt Mode
        - id: material-gruvbox
          label: Material Gruvbox
        - id: mono-high-contrast
          label: Mono High Contrast
        - id: monochroyou
          label: Monochroyou
        - id: monokai
          label: Monokai
        - id: neon-synthwave
          label: Neon Synthwave
        - id: opal
          label: Opal
        - id: palenight
          label: Palenight
    layout:
      position: left
      priority: 32
      group: toolbar
  - source: "./plugins/font-switcher" # engine plugin: the font dropdown
    enabled: true
    order: 61
    options:
      # bakedFont is the site default (applied with JS off, before any
      # script runs). "default" in the fonts list always means this font.
      bakedFont: operator-mono
      fonts: # trim this list to the fonts you want in the menu
        - id: default
          label: Operator Mono
        - id: jetbrains-mono
          label: JetBrains Mono
    layout:
      position: left
      priority: 33
      group: toolbar
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password # frontmatter field that holds the page password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all

  # ─── emitters (site output) ───────────────────────────────────────────
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: false
  - source: "./plugins/folder-alpha" # engine plugin: alphabetical folders in explorer
    enabled: true
    options:
      showFolderCount: true
      showSubfolders: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "./plugins/graph-labels" # engine plugin: node labels on the graph
    enabled: true
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
  - source: "./plugins/backlinks-collapse"
    enabled: true
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/article-title"
    enabled: false
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "./plugins/reader-zen"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: # your footer links
        GitHub: https://github.com/YOU
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "./plugins/h1-title" # engine plugin: H1 from frontmatter title
    enabled: true
    order: 6
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50

# ─── layout groups / per-page-type rules ────────────────────────────────
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-zen
      positions:
        right: []
    tag:
      exclude:
        - reader-zen
      positions:
        right: []
    canvas: {}
    bases: {}
